[project]
name = "rec-sys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.0",
    "google-cloud-aiplatform>=1.80.0",
    "google-cloud-pipeline-components>=2.18.0",
    "google-cloud-storage>=2.19.0",
    "kfp>=2.10.1",
    "nox>=2025.2.9",
    "pandas>=2.2.3",
    "streamlit>=1.42.0",
    "torch>=2.6.0",
]

[project.scripts]
rec-sys = "rec_sys:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "isort>=6.0.0",
    "mypy>=1.15.0",
    "pytest>=8.3.4",
    "ruff>=0.9.5",
]
