name: python-packaging
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    lock_checking:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - run: uv lock --locked

    linting:
        runs-on: ubuntu-latest
        needs: [lock_checking]
        strategy:
            matrix:
                python-version: [3.11, 3.12, 3.13]
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v4  
          with:
            python-version: ${{matrix.python-version}}
        - run: pip install ruff
        - run: ruff check

    formatting:
        runs-on: ubuntu-latest
        needs: [lock_checking]
        strategy:
            matrix:
                python-version: [3.11, 3.12, 3.13]
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v4  
          with:
            python-version: ${{matrix.python-version}}
        - run: pip install ruff
        - run: ruff format
    
    types:
        runs-on: ubuntu-latest
        needs: [lock_checking]
        strategy:
            matrix:
                python-version: [3.11, 3.12, 3.13]
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v4  
          with:
            python-version: ${{matrix.python-version}}
        - run: pip install mypy
        - run: mypy .

    tests:
        runs-on: ubuntu-latest
        needs: [linting, formatting, types]
        strategy:
            matrix:
                python-version: [3.11, 3.12, 3.13]
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v4  
          with:
            python-version: ${{matrix.python-version}}
        - uses: ./.github/actions/setup
        - run: uv install
        - run: uv run pytest
    
    

    

    